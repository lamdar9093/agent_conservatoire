<style>
/* Mise en page : une colonne d'outil. Onglets épinglés en haut ; séances, bilan et membres en dessous. */
:root {
  --paper: #f7f8f5;
  --surface: #ffffff;

  --rule: #dfe2dc;

  --warn: #9a5a00;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --info: #2f5f9e;
  --info-soft: #e4ecf7;
  --shadow: 0 1px 2px rgba(18, 28, 24, 0.06), 0 8px 28px rgba(18, 28, 24, 0.10);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-text: "IBM Plex Serif", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1312; --surface: #161b19; --ink: #eaece7; --ink-soft: #a2aaa6; --rule: #29302d;
    --accent: #6cc7a0; --accent-ink: #0b1a14; --accent-soft: #15302a;
    --good: #6fd39a; --good-soft: #143222; --warn: #efb65e; --warn-soft: #33260f; --bad: #f28b82; --bad-soft: #3a1714; --info: #8fb6ea; --info-soft: #172840;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1312; --surface: #161b19; --ink: #eaece7; --ink-soft: #a2aaa6; --rule: #29302d;
  --accent: #6cc7a0; --accent-ink: #0b1a14; --accent-soft: #15302a;
  --good: #6fd39a; --good-soft: #143222; --warn: #efb65e; --warn-soft: #33260f; --bad: #f28b82; --bad-soft: #3a1714; --info: #8fb6ea; --info-soft: #172840;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.42);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.wrap { width: 100%; max-width: 820px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-soft); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top .wrap { padding-block: 12px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-name { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.brand-name .logo { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: "Harmattan", serif; font-size: 17px; font-weight: 700; line-height: 1; }
.brand-name b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.brand-name small { display: block; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name > span:last-child { min-width: 0; }
.brand-side { display: flex; align-items: center; gap: 8px; flex: none; }
.gear { display: none; color: var(--ink-soft); padding: 6px; border-radius: 8px; }
@media (max-width: 720px) { .brand-side .role { display: none; } .brand-name b { font-size: 17px; } }
.gear[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.brand .role { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px; text-decoration: none; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a .ico { width: 18px; height: 18px; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a[aria-current="page"] .ico { color: var(--accent); }
.bottom-nav { display: none; }
@media (max-width: 720px) {
  .tabs { display: none; }
  .top .wrap { padding-block: 10px; }
  .gear { display: inline-flex; }
  .bottom-nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--rule); padding: 6px max(6px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; border-radius: 10px; text-decoration: none; color: var(--ink-soft); font-size: 11.5px; font-weight: 500; }
  .bottom-nav a .ico { width: 22px; height: 22px; }
  .bottom-nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  main { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)) !important; }
  body.lecture .bottom-nav { display: none; }

}
.kh-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.kh-card { display: grid; gap: 6px; padding: 16px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); text-decoration: none; color: var(--ink); cursor: pointer; text-align: left; }
.kh-card:hover { border-color: var(--accent); }

.kh-card b { font-size: 16px; font-weight: 600; }
.kh-card .muted { font-size: 13px; }
.kh-card .go { color: var(--accent); font-weight: 600; font-size: 13.5px; margin-top: 4px; }
body.lecture main { padding-top: 0; gap: 0; max-width: none; padding-left: 0; padding-right: 0; }
body.lecture .top { display: none; }
html:has(body.lecture), body.lecture { overflow: hidden; height: 100%; }
body.lecture main { padding: 0 !important; }
body.lecture::before { background: var(--surface); }
.lecture-bar { display: flex; align-items: center; gap: 10px; padding: 6px max(12px, env(safe-area-inset-left, 0px)); padding-top: calc(6px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--rule); background: var(--surface); }
.lecture-bar .logo-mini { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: "Harmattan", serif; font-size: 12px; font-weight: 700; text-decoration: none; }
.lecture-bar b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lecture-frame { display: block; width: 100%; border: 0; background: var(--paper); }

main { padding-block: 20px 60px; display: grid; gap: 16px; }
main > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
.panel h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.panel p { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); }
.field textarea { padding: 9px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; resize: vertical; min-height: 64px; }
.field input, .field select { padding: 9px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 0; }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }

.list { display: grid; gap: 8px; }
.seance { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
.seance:hover { border-color: var(--accent); }

.seance .when .pill { font-size: 12.5px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.c-p { color: var(--good); } .c-r { color: var(--warn); } .c-a { color: var(--bad); }
.pill { padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.pill.p { background: var(--good-soft); color: var(--good); }
.pill.r { background: var(--warn-soft); color: var(--warn); }
.pill.a { background: var(--bad-soft); color: var(--bad); }

.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.people { display: grid; gap: 6px; margin-top: 12px; }
.person { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
.person .name { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.person .tags { font-size: 11.5px; color: var(--ink-soft); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--surface); flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.seg button[aria-pressed="true"][data-v="P"] { background: var(--good); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="R"] { background: var(--warn); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="A"] { background: var(--bad); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="E"] { background: var(--info); color: var(--surface); }
.pill.e { background: var(--info-soft); color: var(--info); }
.motifs { order: 5; flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 2px; }
.motifs .lbl { font-size: 12.5px; color: var(--ink-soft); margin-right: 2px; }
.motifs .toggle[aria-pressed="true"] { border-color: var(--info); background: var(--info-soft); color: var(--info); }
.motifs input { flex: 1 1 160px; min-width: 0; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13.5px; }
.person.prev { border-color: var(--info); }
.sub { display: block; font-size: 11.5px; color: var(--info); font-weight: 500; }

@media (max-width: 560px) {
  .person { flex-wrap: wrap; padding: 10px; }

  .person .toggle.tari { flex: 1 1 100%; padding: 8px; }
  .person .motifs { order: 0; }
  .seance { flex-wrap: wrap; }
  .seance .counts { flex: 1 1 100%; justify-content: flex-start; }
  .list .member input[type="text"] { flex: 1 1 100%; }
  form#f-membre .field, form#f-kh .field { flex: 1 1 100% !important; }
  .tari-box .seg { display: flex; width: 100%; }
  .tari-box .seg button { flex: 1; padding: 8px 4px; }
  .table-wrap .bar { display: none; }
  .table-wrap th, .table-wrap td { padding: 8px 5px; }
  .table-wrap th { font-size: 10.5px; letter-spacing: 0.02em; }
  .table-wrap table { font-size: 13.5px; }
  .table-wrap th:nth-child(2), .table-wrap td:nth-child(2) { display: none; }
  .table-wrap .sub { white-space: normal; font-size: 10.5px; line-height: 1.25; }
}

.confirm { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bad-soft); display: grid; gap: 8px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.table-wrap { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); }
.bar { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--rule); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); }
.flag { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--bad); }

.member { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
.member input[type="text"] { flex: 1 1 180px; min-width: 0; padding: 7px 9px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); font-weight: 500; }
.member input[type="text"]:hover, .member input[type="text"]:focus { border-color: var(--rule); background: var(--surface); }
.wa { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--rule); }
.wa-bulle { max-width: 520px; padding: 10px 12px; border-radius: 4px 12px 12px 12px; background: var(--accent-soft); color: var(--ink); font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; box-shadow: var(--shadow); }
.check { display: flex; align-items: center; gap: 8px; flex: 1 1 100%; font-size: 14px; color: var(--ink); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.vers-select { font-family: var(--font-ui), "Harmattan", serif; }
.member.off { opacity: 0.6; }
.date-inline { padding: 3px 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12.5px; }
[lang="ar"] { font-family: "Harmattan", "Noto Naskh Arabic", "Geeza Pro", serif; }
.kh-ar { font-size: 26px; line-height: 1.6; direction: rtl; }
.item { padding: 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); display: grid; gap: 4px; }
.item.attente { border-color: var(--warn); background: var(--warn-soft); }

.item a, .tari-box a { color: var(--accent); font-weight: 600; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.toggle.tari { color: var(--warn); border-color: var(--warn); }

.panel.alert { border-color: var(--warn); background: var(--warn-soft); }
.owed { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.member .who { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.member .meta { font-size: 12.5px; color: var(--ink-soft); }
.member .actions { display: flex; gap: 6px; margin-left: auto; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.inline-form { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--rule); }
h3.group { margin: 18px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.linkish { border: 0; background: none; padding: 4px 2px; color: var(--ink-soft); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
h3.group .linkish { text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-size: 12px; }
.toggle { border: 1px solid var(--rule); background: transparent; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.empty { padding: 28px 16px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--rule); border-radius: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: min(92vw, 480px); width: max-content; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 14px; box-shadow: var(--shadow); }
.dz-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); }
.dz-card:hover { border-color: var(--accent); }

.dz-date { flex: none; width: 58px; padding: 6px 0; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; justify-items: center; line-height: 1.1; }

.dz-go { flex: none; font-size: 22px; color: var(--ink-soft); }
.big-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.big-stat { padding: 12px 14px; border-radius: 12px; display: grid; gap: 2px; }
.big-stats.one { grid-template-columns: 1fr; }
.big-stat b small { font-size: 16px; font-weight: 500; opacity: 0.75; }
.name-grid span.off { opacity: 0.55; border-style: dashed; }
.seg-full { display: flex; width: 100%; }
.seg-full button { flex: 1; padding: 9px 8px; }
.big-stat b { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big-stat span { font-size: 13.5px; font-weight: 500; }
.big-stat.ok { background: var(--good-soft); color: var(--good); }
.big-stat.wait { background: var(--warn-soft); color: var(--warn); }

.wait-card { padding: 10px 12px; border: 1px solid var(--warn); border-radius: 10px; background: var(--warn-soft); display: grid; gap: 8px; }

  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  function creerSeance(date, type, horaire) {

  function seancesFiltrees() {

      if (filtre.periode === "precedent") return s.date.slice(0, 7) === prec;

  function calculerBilan(liste) {

  function tariPlain(td) {
    var kh = khassidas[td.khassida];
    var t = kh ? kh.titre : "";
    if (kh && td.tout) t += ", khassida entier";
    else if (kh && td.de) t += ", vers " + td.de + (td.a && Number(td.a) !== Number(td.de) ? " à " + td.a : "");
    if (td.consigne) t += (t ? " (" + td.consigne + ")" : td.consigne);
    return t || "contenu à préciser";
  }
  function texteWhatsApp(liste, stats) {
    var sc = seanceChoisie();
    if (sc) return texteSeance(sc, stats);
    var L = [];
    var parDate = liste.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    L.push("📋 *BILAN DES PRÉSENCES*");
    L.push("");
    L.push("*" + libellePeriode() + "* · " + (filtre.kourel === "tous" ? "toutes les répétitions" : TYPES[filtre.kourel]));
    L.push("");
    L.push(parDate.length <= 6
      ? parDate.map(function (s) { return jourCourt(s.date) + " (" + ABR[s.type] + ")"; }).join(" · ")
      : pluriel(parDate.length, "répétition"));
    L.push("");
    var fr = function (a, b) { return a.nom.localeCompare(b.nom, "fr"); };
    var assidus = stats.filter(function (st) { return !st.A && !st.R; }).sort(fr);
    var retards = stats.filter(function (st) { return !st.A && st.R; }).sort(function (a, b) { return (b.R - a.R) || fr(a, b); });
    var absents = stats.filter(function (st) { return st.A; }).sort(function (a, b) { return (b.A - a.A) || fr(a, b); });
    if (absents.length) {
      L.push("🔴 *Absences* (" + absents.length + ")");
      absents.forEach(function (st) { L.push("• " + st.nom + " : " + pluriel(st.A, "absence") + " sur " + st.total + (st.E ? (st.E === st.A ? (st.A > 1 ? ", toutes prévenues" : ", prévenue") : ", dont " + st.E + " prévenue" + (st.E > 1 ? "s" : "")) : "") + (st.R ? ", " + pluriel(st.R, "retard") : "")); });
      L.push("");
    }
    if (retards.length) {
      L.push("🟡 *Retards* (" + retards.length + ")");
      retards.forEach(function (st) { L.push("• " + st.nom + " : " + pluriel(st.R, "retard")); });
      L.push("");
    }
    if (assidus.length) {
      L.push("🟢 *Présents à toutes les répétitions* (" + assidus.length + ")");
      puces(L, assidus.map(function (st) { return st.nom; }));
      L.push("");
    }
    lignesPause(L, filtre.kourel, stats, null);
    parDate.forEach(function (s) {
      if (!s.tari || s.tari === "aucun") return;
      var manquants = nomsTari(s, tariCompte(s).manquants);
      if (!manquants.length) return;
      L.push("🎙️ *Tari à maîtriser avant la répétition du " + jourEcheance(echeanceTari(s)) + "*");
      L.push(tariPlain(s.tariDetail || {}));
      puces(L, manquants);
      L.push("");
    });
    L.push("Merci à tous pour votre engagement.");
    L.push("Cellule Conservatoire · Dahira Mafatihul Bichri Touba Estrie");
    return L.join("\n");
  }
  /* Membres en pause à afficher : pas déjà comptés dans le bilan, et déjà en pause à la date de référence. */
  function enPause(type, stats, dateRef) {
    var comptes = {};
    (stats || []).forEach(function (st) { comptes[st.id] = true; });
    return Object.keys(membres).map(function (k) { return membres[k]; })
      .filter(function (m) {
        if (statutMembre(m) !== "pause" || comptes[m.id]) return false;
        if (dateRef && m.depuis && m.depuis > dateRef) return false;
        return !type || type === "tous" || type === "rg" ? (m.k1 || m.k2) : m[type];
      })
      .sort(triNom).map(function (m) { return m.nom; });
  }
  function lignesPause(L, type, stats, dateRef) {
    var noms = enPause(type, stats, dateRef);
    if (!noms.length) return;
    L.push("⏸️ *En pause, présence non requise* (" + noms.length + ")");
    puces(L, noms);
    L.push("");
  }
  function texteSeance(s, stats) {
    var L = [];
    var fr = function (a, b) { return a.nom.localeCompare(b.nom, "fr"); };
    var jour = jourLong(s.date).replace(/ \d{4}$/, "");
    L.push("📋 *" + titreRepetition(s.type) + "*");
    L.push("");
    L.push("*" + jour + "*" + (horaireDe(s) ? " · " + horaireDe(s) : ""));
    L.push("");
    var c = compter(s);
    L.push(pluriel(c.P, "présent") + " · " + pluriel(c.R, "retard") + " · " + pluriel(c.A, "absent") + (c.E ? " (" + c.E + (c.E > 1 ? " ont" : " a") + " prévenu)" : ""));
    L.push("");
    var absents = stats.filter(function (st) { return st.A && !st.E; }).sort(fr);
    var prevenus = stats.filter(function (st) { return st.E; }).sort(fr);
    var retards = stats.filter(function (st) { return st.R; }).sort(fr);
    var presents = stats.filter(function (st) { return st.P; }).sort(fr);
    if (absents.length) { L.push("🔴 *Absents" + (prevenus.length ? " sans prévenir" : "") + "* (" + absents.length + ")"); puces(L, absents.map(function (st) { return st.nom; })); L.push(""); }
    if (prevenus.length) { L.push("🔵 *Absents ayant prévenu* (" + prevenus.length + ")"); puces(L, prevenus.map(function (st) { return st.nom; })); L.push(""); }
    if (retards.length) { L.push("🟡 *En retard* (" + retards.length + ")"); puces(L, retards.map(function (st) { return st.nom; })); L.push(""); }
    if (presents.length) { L.push("🟢 *Présents* (" + presents.length + ")"); puces(L, presents.map(function (st) { return st.nom; })); L.push(""); }
    lignesPause(L, s.type, stats, s.date);
    if (s.tari && s.tari !== "aucun") {
      var manquants = nomsTari(s, tariCompte(s).manquants);
      if (manquants.length) {
        L.push("🎙️ *Tari à maîtriser avant la répétition du " + jourEcheance(echeanceTari(s)) + "*");
        L.push(tariPlain(s.tariDetail || {}));
        if (s.tari === "tous" && !tariCompte(s).recus && !tariCompte(s).retravail) L.push("→ tout le monde"); else puces(L, manquants);
        L.push("_Sans Tari maîtrisé à temps : pas de dahira ni de prestation (chartes du kourel)._");
        L.push("");
      }
    }
    L.push("Merci à tous pour votre engagement.");
    L.push("Cellule Conservatoire · Dahira Mafatihul Bichri Touba Estrie");
    return L.join("\n");
  }
  function waHtml(txt) {

  function montrer(ta, txt) { if (!ta) return; ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("Sélectionnez le texte affiché pour le copier."); }

  /* ---------- Chartes et sanctions du kourel (texte de la commission de discipline) ---------- */
  var CHARTES_HTML = '<p>La commission de discipline tient à rappeler que ces règles et sanctions ne visent, en aucun cas, à exclure une personne du kourel ou à la contraindre à faire l’impossible. Nous tenons juste à rappeler l’importance et la responsabilité qui découle de psalmodier les écrits du Cheikh. D’où cette nécessité d’établir la charte des règles et sanctions du kourel pour une meilleure organisation.</p><p>Nous prions d’obtenir l’agrément d’ALLAH SAW par le biais de Serigne Touba.</p><h3>Chartes</h3><ul><li>Les membres du kourel sont tenus de porter exclusivement des tenues traditionnelles de type <b>baay-lahat, segne souhaibou, thiourki ndiarem</b>, ou toute autre tenue du même genre. Cette exigence s’applique <b>en tout temps</b>, aussi bien lors des répétitions que lors des évènements (Magal, Gamou, prestations sur invitation ou toute autre activité officielle).</li><li>Les membres du kourel doivent éviter de manipuler leurs cellulaires pendant toute la durée de déclamation des Xassidas sauf urgence.</li><li>Les membres du kourel doivent avoir une coiffure correcte et uniformisée.</li><li>Les membres du kourel n’ont pas le droit de porter des colliers, chaînes, bracelets, montres et chapelets lors des prestations et des événements. Cette interdiction s’applique également lors des répétitions.</li><li>Les séances de répétition ont lieu tous les vendredis de 18h à 21h. Tout changement d’horaire doit être voté par les membres du kourel.</li><li>Il est de la responsabilité du dieuwrigne du kourel d’animer les séances de répétitions.</li><li>Seuls les membres du conservatoire ont la charge de faire des « leerals » et il est de la responsabilité des autres membres de s’abstenir de toute perturbation.</li><li>Les membres du kourel ont l’obligation d’écouter et de travailler les enregistrements audios mis à leur disposition par le conservatoire. En cas d’absence à une séance de répétition, la personne concernée est tenue d’envoyer son fichier audio aux membres du conservatoire ainsi qu’aux personnes désignées par le Jeuwrigne du conservatoire. L’envoi peut se faire du vendredi de la répétition manquée jusqu’au samedi suivant. Toutefois il est de la responsabilité du membre absent de répéter et d’envoyer son audio autant de fois que nécessaire jusqu’à la maîtrise complète du « leral ».</li><li>Les membres du kourel se doivent d’être assidus aux séances de répétitions et dahiras.</li><li>Les membres du kourel doivent veiller à bien se tenir et adopter une position assise correcte lors des déclamations de Xassidas.</li><li>Les membres du kourel sont priés de signaler à l’avance leur absence ou retard lors des séances de répétition ou aux dahiras. Pour les séances de répétition, il suffit de signaler son retard à un membre du comité de discipline pour pouvoir intégrer le kourel sur autorisation de ce dernier. Pour les séances aux dahiras, 30 minutes de retard seront acceptées si la séance commence à 18h, et aucun retard ne sera toléré si elle commence à 19h. En cas de dépassement de ces délais aux dahiras, même si le retard a été signalé à l’avance, la personne ne pourra pas intégrer le kourel.</li><li>En cas de retard, éviter d’intégrer le kourel sauf sur autorisation du dieuwrigne du kourel.</li><li>Il est de la responsabilité du chargé de la commission de discipline de recadrer les débats lors des séances de répétition ou aux dahiras. À lui de veiller également à la manière dont sont assis les membres du kourel.</li><li>Trois mois avant le magal, on n’intègre plus personne dans le kourel à l’exception d’un nouvel arrivant dont les potentiels ont été évalués par les membres du conservatoire. Pour les anciens membres qui se joignent au kourel que pour les événements, aucune tolérance ne sera acceptée.</li></ul><h3>Sanctions</h3><ul><li>L’irrespect relatif à l’habillement établi par la commission discipline entraine un avertissement. Si cela se reproduit, la personne ne participera pas à cette séance de répétition ou au dahira.</li><li>Tout membre du kourel ayant une coiffure non conforme aux exigences préétablies par la commission discipline ne pourra pas participer aux séances de répétition, aux dahiras, ni à toutes les prestations ou événements officiels du kourel.</li><li>Les membres du kourel sont tenus de maîtriser ce qui a été retenu lors des répétitions. Au cas contraire, ils peuvent continuer à répéter mais ne pourront être acceptés au kourel qu’après avoir maîtrisé ladite partie.</li><li>Tout membre du kourel absent à une répétition qui n’a pas envoyé son fichier audio ou qui n’a pas maîtrisé le leeral avant la répétition suivante ne pourra pas participer aux dahiras ni à toutes les prestations ou événements officiels du kourel, tels que Magal, Gamou, Kazu Rajab, etc.</li></ul>';
  function vueChartes() {

  /* ---------- Sauvegarde des données ---------- */
  function lireDerniereSauvegarde() { try { return localStorage.getItem("presences-sauvegarde") || ""; } catch (e) { return ""; } }
  function ecrireDerniereSauvegarde(v) { try { localStorage.setItem("presences-sauvegarde", v); } catch (e) { /* stockage indisponible */ } }
  function sansId(o) { var c = {}; Object.keys(o).forEach(function (k) { if (k !== "id") c[k] = o[k]; }); return c; }
  function donneesCompletes() {
    var col = function (obj) { var r = {}; Object.keys(obj).forEach(function (k) { r[k] = sansId(obj[k]); }); return r; };
    var se = {}; seances.forEach(function (x) { se[x.id] = sansId(x); });
    return {
      application: "Présences du Conservatoire · Dahira Mafatihul Bichri Touba Estrie",
      format: 1, exporteLe: new Date().toISOString(),
      collections: { membres: col(membres), seances: se, khassidas: col(khassidas), dahiras: dahirasCfg, programmes: programmes, evaluations: evaluations }
    };
  }
  function csvPresences() {
    var q = function (v) { v = String(v == null ? "" : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var L = [["Date", "Répétition", "Membre", "Kourels", "Statut", "Motif (absence prévenue)", "Tari demandé", "État du Tari", "Chartes"].join(";")];
    seances.slice().sort(function (a, b) { return a.date === b.date ? (a.type < b.type ? -1 : 1) : (a.date < b.date ? -1 : 1); }).forEach(function (x) {
      (x.participants || []).map(function (id) { return { id: id, nom: membres[id] ? membres[id].nom : "Membre supprimé" }; }).sort(triNom).forEach(function (p) {
        var nonRequis = !requis(x, p.id), v = choixDe(x, p.id);
        var statut = nonRequis ? "Non requis (pause)" : v === "E" ? "Absent (prévenu)" : STATUTS[v];
        var du = !nonRequis && tariConcerne(x, p.id);
        L.push([x.date, TYPES[x.type] || x.type, p.nom, membres[p.id] ? tagsKourel(membres[p.id]) : "", statut, v === "E" ? motifTexte(x, p.id) : "",
          du ? "Oui" : "Non", du ? ETATS_TARI[etatTari(x, p.id)] : "", consequences(x, p.id).map(function (c) { return c.txt; }).join(", ")].map(q).join(";"));
      });
    });
    return "﻿" + L.join("\r\n");
  }
  function telecharger(nom, contenu, etiquette) {
    var api = claudeApi;
    (api ? api.use("downloads").catch(function () { return null; }) : Promise.resolve(null)).then(function (dl) {
      if (!dl) { var ta = document.getElementById("sv-texte"); montrer(ta, contenu); return; }
      dl.save({ filename: nom, data: contenu }).then(function () {
        if (etiquette === "complete") { ecrireDerniereSauvegarde(today()); afficher(); }
        toast("Fichier enregistré : " + nom);
      }, function (e) {
        if (e && e.code === "declined") return;
        if (e && e.code === "rate_limited") { toast("Une fenêtre d’enregistrement est déjà ouverte."); return; }
        var ta2 = document.getElementById("sv-texte"); montrer(ta2, contenu);
      });
    });
  }
  function vueSauvegarde() {

      '</span><span class="pill n">' + Object.keys(khassidas).length + " khassida" + (Object.keys(khassidas).length > 1 ? "s" : "") + '</span><span class="pill n">' + nbE + " évaluation" + (nbE > 1 ? "s" : "") + "</span></div>" +
      (vieille ? '<div class="me-banner wait" style="margin-top:12px">💾 <span>' + (der ? "Dernière sauvegarde sur cet appareil le " + esc(court(der)) + " : pensez à en refaire une." : "Aucune sauvegarde faite depuis cet appareil.") + "</span></div>"

      '<textarea class="copy" id="sv-texte" readonly hidden aria-label="Données à copier"></textarea></section>';
    app.insertAdjacentHTML("beforeend", html);
  }

  /* ---------- Navigation et événements ---------- */

        editRep = null;
        if (nid === rid) { enregistrerRappel(rid, { horaire: nh }); toast("Horaire enregistré."); return; }
        if (programmes[nid] && !programmes[nid].annulee) { toast("Il y a déjà une répétition " + TYPES[nt] + " ce jour-là."); return; }
        var ancien = progDe(rid), copie = {};
        Object.keys(ancien).forEach(function (k) { copie[k] = ancien[k]; });
        copie.horaire = nh; copie.extra = true; copie.annulee = false; copie.deplaceeVers = null; copie.deplaceeDe = rid; copie.envoye = false; copie.motifAnnulation = "";
        db.doc("programmes/" + nid).set(copie).then(function () {
          var fin = ancien.extra ? db.doc("programmes/" + rid).delete() : db.doc("programmes/" + rid).set(Object.assign({}, ancien, { annulee: true, deplaceeVers: nid }));
          return fin;
        }).then(function () { toast("Répétition déplacée au " + jourCourt(nd) + "."); }, echec);
        return;
      }
      if (ra === "rep-add") {
        var ad = lire("n-date"), at = lire("n-type"), ah = lire("n-heure");
        if (!ad) { toast("Choisissez une date."); return; }
        if (ad < today()) { toast("Choisissez une date à venir."); return; }
        var aid = ad + "-" + at;
        var estDefaut = prochainesRepetitions().some(function (r) { return r.id === aid; }) && !(programmes[aid] && programmes[aid].extra);
        editRep = null;
        if (programmes[aid] && programmes[aid].annulee) { enregistrerRappel(aid, { annulee: false, deplaceeVers: null, horaire: ah }); toast("Répétition rétablie."); return; }
        if (estDefaut || (programmes[aid] && programmes[aid].extra)) { toast("Cette répétition est déjà prévue."); afficher(); return; }
        db.doc("programmes/" + aid).set({ horaire: ah, lieu: lieuParDefaut(), extra: true }).then(function () { toast("Répétition ajoutée : " + jourCourt(ad) + "."); }, echec);
        return;
      }
    }
    if (b.dataset.sugg && rappelOuvert && peutModifier) {
      var tyS = rappelOuvert.slice(11), lst = MOT_SUGG.concat(MOT_DEFAUT[tyS] && MOT_SUGG.indexOf(MOT_DEFAUT[tyS]) < 0 ? [MOT_DEFAUT[tyS]] : []);
      if (b.dataset.sugg === "vide") { enregistrerRappel(rappelOuvert, { note: "" }); return; }
      var choix = lst[Number(b.dataset.sugg)];
      var lignes = progDe(rappelOuvert).note.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      lignes = lignes.indexOf(choix) > -1 ? lignes.filter(function (x) { return x !== choix; }) : lignes.concat([choix]);
      enregistrerRappel(rappelOuvert, { note: lignes.join("\n") });
      return;
    }
    if (b.dataset.action === "rappel-envoye" && rappelOuvert && peutModifier) { enregistrerRappel(rappelOuvert, { envoye: true }); toast("Rappel marqué comme envoyé."); return; }
    if (b.dataset.dahira) { dahiraOuvert = b.dataset.dahira; apercuDahira = false; afficher(); window.scrollTo(0, 0); return; }
    if (b.dataset.mode && peutModifier && dahiraOuvert) {
      var md = b.dataset.mode;
      db.doc("dahiras/" + dahiraOuvert).set({ mode: md }).then(function () { toast(MODE_PHRASE[md]); }, echec);
      return;
    }
    if (b.dataset.action === "apercu-dahira") { apercuDahira = !apercuDahira; afficher(); return; }
    if (b.dataset.action === "copier-dahira" && dahiraOuvert) {
      var txd = texteDahira(dahiraOuvert, etatDahira(dahiraOuvert)), tad = document.getElementById("dz-texte");
      try { navigator.clipboard.writeText(txd).then(function () { toast("Message copié : collez-le dans le groupe WhatsApp."); }, function () { montrer(tad, txd); }); } catch (er) { montrer(tad, txd); }
      return;
    }
    if (b.dataset.tetat && peutModifier) {
      var parts = b.dataset.tetat.split("|"), nomR = membres[parts[1]] ? membres[parts[1]].nom : "Membre";
      majEtatTari(parts[0], parts[1], parts[2]).then(function () {
        if (parts[2] !== "maitrise") { toast("Tari reçu : " + nomR + " doit le retravailler et le renvoyer jusqu’à maîtrise."); return; }
        var xb = dahiraOuvert ? etatDahira(dahiraOuvert).tariBloques.filter(function (x) { return x.m.id === parts[1]; })[0] : null;
        var reste = xb ? xb.seances.filter(function (sx) { return sx.id !== parts[0]; }).length : 0;
        toast(reste ? "Tari maîtrisé. " + nomR + " a encore un Tari à maîtriser." : "Tari maîtrisé : " + nomR + " peut rejoindre son kourel.");
      }, echec);
      return;
    }
    if (b.dataset.tarietat && peutModifier && seanceOuverte) {
      var pt = b.dataset.tarietat.split("|");
      majEtatTari(seanceOuverte, pt[0], pt[1]).catch(echec);
      return;
    }
    if (b.dataset.indiv && peutModifier && seanceOuverte) {
      var si = seances.filter(function (x) { return x.id === seanceOuverte; })[0] || {}, iv = {};
      iv[b.dataset.indiv] = !(si.tariIndividuel || {})[b.dataset.indiv];
      db.doc("seances/" + seanceOuverte).update({ tariIndividuel: iv }).then(function () {
        if (iv[b.dataset.indiv]) toast("Partie à retravailler : " + (membres[b.dataset.indiv] ? membres[b.dataset.indiv].nom : "le membre") + " doit envoyer son Tari jusqu’à maîtrise.");
      }, echec);
      return;
    }
    if (b.dataset.action === "disc-ouvrir" && peutModifier) { discOuvert = b.dataset.id; afficher(); return; }
    if (b.dataset.action === "disc-fermer") { discOuvert = null; afficher(); return; }
    if (b.dataset.disc && peutModifier && seanceOuverte) {
      var pd = b.dataset.disc.split("|"), sd2 = seances.filter(function (x) { return x.id === seanceOuverte; })[0] || {};
      var cur = marquesDe(sd2, pd[0]), mj = {}; mj[pd[0]] = {}; mj[pd[0]][pd[1]] = !cur[pd[1]];
      db.doc("seances/" + seanceOuverte).update({ discipline: mj }).then(function () {
        if (!mj[pd[0]][pd[1]]) return;
        var sNow = seances.filter(function (x) { return x.id === seanceOuverte; })[0] || sd2;
        var cq = consequences(sNow, pd[0]).filter(function (c) { return c.ecarte; });
        toast(cq.length ? "Selon les chartes : " + (membres[pd[0]] ? membres[pd[0]].nom : "le membre") + " ne participe pas à cette séance." : "Avertissement enregistré (tenue). Une récidive ce mois-ci écarte de la séance.");
      }, echec);
      return;
    }
    if (b.dataset.set && peutModifier) {
      var sv = seances.filter(function (x) { return x.id === seanceOuverte; })[0] || {};
      var pid = b.dataset.set, nv = b.dataset.v;
      if (choixDe(sv, pid) === nv) return;
      var patch = {}, maj = { statuts: patch };
      patch[pid] = nv === "E" ? "A" : nv;
      if (nv === "E") { maj.prevenus = {}; maj.prevenus[pid] = { motif: "", note: "" }; }
      else if ((sv.prevenus || {})[pid]) { maj.prevenus = {}; maj.prevenus[pid] = null; }
      db.doc("seances/" + seanceOuverte).update(maj).catch(echec);
      return;
    }
    if (b.dataset.motif && peutModifier) {
      var sm2 = seances.filter(function (x) { return x.id === seanceOuverte; })[0] || {};
      var cur = (sm2.prevenus || {})[b.dataset.motif] || {};
      var pm = {}; pm[b.dataset.motif] = { motif: cur.motif === b.dataset.m ? "" : b.dataset.m, note: cur.motif === b.dataset.m ? (cur.note || "") : "" };
      db.doc("seances/" + seanceOuverte).update({ prevenus: pm }).catch(echec);
      return;
    }
    if (b.hasAttribute("data-askdel")) { confirmerSuppression = true; afficher(); return; }
    if (b.hasAttribute("data-nodel")) { confirmerSuppression = false; afficher(); return; }
    if (b.hasAttribute("data-del")) {
      var id = seanceOuverte;
      db.doc("seances/" + id).delete().then(function () { seanceOuverte = null; confirmerSuppression = false; afficher(); toast("Séance supprimée."); }, echec);
      return;
    }
    if (b.dataset.tari && peutModifier) { db.doc("seances/" + seanceOuverte).update({ tari: b.dataset.tari }).catch(echec); return; }

    var act = b.dataset.action, mid = b.dataset.id;
    if (act === "voir-partis") { voirPartis = !voirPartis; afficher(); return; }
    if (act && peutModifier) {
      var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
      if (act === "pause" || act === "parti") { formOuvert = { id: mid, type: act }; afficher(); var mo = document.getElementById("p-motif"); if (mo) mo.focus(); return; }
      if (act === "annuler") { formOuvert = null; afficher(); return; }
      if (act === "ajuster") { ajusterListe = !ajusterListe; afficher(); return; }
      if (act === "edit-tari") { tariEdition = true; afficher(); return; }
      if (act === "fin-tari") { tariEdition = false; confirmerTari = false; afficher(); return; }
      if (act === "suppr-tari") { confirmerTari = true; afficher(); return; }
      if (act === "non-suppr-tari") { confirmerTari = false; afficher(); return; }
      if (act === "ok-suppr-tari") {
        var so = seances.filter(function (x) { return x.id === seanceOuverte; })[0];
        if (!so) return;
        var copie = {};
        Object.keys(so).forEach(function (k) { if (["id", "tari", "tariDetail", "tariRecu", "tariEtat", "tariIndividuel"].indexOf(k) < 0) copie[k] = so[k]; });
        copie.tari = "aucun";
        db.doc("seances/" + so.id).set(copie).then(function () { confirmerTari = false; tariEdition = false; afficher(); toast("Tari supprimé pour cette séance."); }, echec);
        return;
      }
      if (act === "ok-pause") { changerStatut(mid, "pause", val("p-motif"), val("p-retour"), val("p-depuis")); return; }
      if (act === "ok-parti") { changerStatut(mid, "parti", val("p-motif"), "", val("p-depuis")); return; }
      if (act === "reactiver") { changerStatut(mid, "actif", "", ""); return; }
      var sc = seances.filter(function (x) { return x.id === seanceOuverte; })[0];
      if (act === "ajouter-seance" && sc) {
        var nid = val("s-ajout");
        if (!nid) { toast("Choisissez d’abord un membre."); return; }
        var st = {}; st[nid] = "P";
        db.doc("seances/" + sc.id).update({ participants: (sc.participants || []).concat([nid]), statuts: st })
          .then(function () { toast(membres[nid].nom + " ajouté à la séance, marqué présent."); }, echec);
        return;
      }
      if (act === "retirer" && sc) {
        db.doc("seances/" + sc.id).update({ participants: (sc.participants || []).filter(function (x) { return x !== mid; }) })
          .then(function () { toast((membres[mid] ? membres[mid].nom : "Membre") + " retiré de la séance."); }, echec);
        return;
      }
    }
    if (b.dataset.k && b.dataset.id && peutModifier) {
      var m = membres[b.dataset.id], u = {};
      u[b.dataset.k] = b.dataset.k === "actif" ? m.actif === false : !m[b.dataset.k];
      db.doc("membres/" + b.dataset.id).update(u).catch(echec);
    }
  });
  app.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-envoye]");
    if (a && comptesApi) comptesApi.envoye(a.dataset.envoye).then(chargerComptes, function () {});
    var pv = e.target.closest("a[data-prevenir]");
    if (pv) {
      var idp = pv.dataset.prevenir, cp = (comptesEtat && comptesEtat.comptes || {})[idp];
      if (cp && cp.aPrevenir) { prevenusSession[idp] = true; cp.aPrevenir = false; }
      if (comptesApi) comptesApi.envoye(idp).then(chargerComptes, function () {});
      setTimeout(afficher, 300);
    }
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.depuis && peutModifier && t.value) {
      db.doc("membres/" + t.dataset.depuis).update({ depuis: t.value }).then(function () { toast("Date de pause modifiée : les séances à partir de cette date ne lui sont plus comptées."); }, echec);
      return;
    }
    if (t.dataset && t.dataset.note && peutModifier && seanceOuverte) {
      var pn = {}; pn[t.dataset.note] = { note: t.value.trim() };
      db.doc("seances/" + seanceOuverte).update({ prevenus: pn }).catch(echec);
      return;
    }
    if (rappelOuvert && peutModifier && /^r-(heure|lieu|kh|tout|de|a|note|taris|motif)$/.test(t.id)) {
      var f = t.id.slice(2), v;
      if (f === "motif") { enregistrerRappel(rappelOuvert, { motifAnnulation: t.value.trim() }); return; }
      if (f === "heure") enregistrerRappel(rappelOuvert, { horaire: t.value.trim() });
      else if (f === "lieu" || f === "note") { v = {}; v[f] = t.value.trim(); enregistrerRappel(rappelOuvert, v); }
      else if (f === "kh") { var nk = khassidas[t.value]; enregistrerRappel(rappelOuvert, { khassida: t.value, tout: false, de: 1, a: nk ? (nk.vers || null) : null }); }
      else if (f === "tout") enregistrerRappel(rappelOuvert, { tout: t.checked });
      else if (f === "taris") enregistrerRappel(rappelOuvert, { taris: t.checked });
      else { v = {}; v[f] = parseInt(t.value, 10) || 1; enregistrerRappel(rappelOuvert, v); }
      return;
    }
    if (t.dataset && t.dataset.tel && peutModifier) {
      db.doc("membres/" + t.dataset.tel).update({ telephone: t.value.trim() }).then(function () { toast("Numéro enregistré."); }, echec);
      return;
    }
    if (t.dataset && t.dataset.evcom && peutModifier) {
      var ce = evaluations[t.dataset.evcom] || {}, nv3 = {};
      Object.keys(CRITERES).forEach(function (k) { nv3[k] = ce[k] || 0; });
      nv3.commentaire = t.value.trim(); nv3.date = today();
      db.doc("evaluations/" + t.dataset.evcom).set(nv3).catch(echec);
      return;
    }
    if (t.id === "n-date" && t.value) {
      var nty = typeDuJour(t.value), sel = document.getElementById("n-type"), hh = document.getElementById("n-heure");
      if (sel) sel.value = nty; if (hh) hh.value = HORAIRE[nty] || "";
      return;
    }
    if (t.id === "s-horaire" && peutModifier && seanceOuverte) {
      db.doc("seances/" + seanceOuverte).update({ horaire: t.value.trim() }).then(function () { toast("Horaire enregistré."); }, echec);
      return;
    }
    if (t.id === "moi") { moiCourant = t.value; ecrireMoi(moiCourant); afficher(); return; }
    if (["t-kh", "t-de", "t-a", "t-cons", "t-tout"].indexOf(t.id) > -1 && peutModifier && seanceOuverte) {
      var kid = document.getElementById("t-kh").value;
      var nb = khassidas[kid] ? (khassidas[kid].vers || null) : null;
      var elDe = document.getElementById("t-de"), elA = document.getElementById("t-a"), elTout = document.getElementById("t-tout");
      var tout = elTout ? elTout.checked : false;
      var de = elDe ? parseInt(elDe.value, 10) || 1 : 1;
      var a = elA ? parseInt(elA.value, 10) || nb : nb;
      if (t.id === "t-kh") { tout = false; de = 1; a = nb; }
      if (tout) { de = 1; a = nb; }
      if (a && de > a) a = de;
      db.doc("seances/" + seanceOuverte).update({ tariDetail: { khassida: kid, tout: tout, de: de, a: a, consigne: document.getElementById("t-cons").value.trim() } }).catch(echec);
      return;
    }
    if (t.dataset && t.dataset.nom && peutModifier) {
      var nom = t.value.trim();
      if (nom && membres[t.dataset.nom] && nom !== membres[t.dataset.nom].nom) db.doc("membres/" + t.dataset.nom).update({ nom: nom }).then(function () { toast("Nom modifié."); }, echec);
    }
  });

  /* ---------- Démarrage ---------- */
  lireHash();
  var claudeApi = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  Promise.all([
    claudeApi ? claudeApi.use("db").catch(function () { return null; }) : Promise.resolve(null),
    claudeApi ? claudeApi.use("user").catch(function () { return null; }) : Promise.resolve(null)
  ]).then(function (r) {
    db = r[0];
    var user = r[1];
    if (!db) {
      document.getElementById("role").textContent = "Hors ligne";
      app.innerHTML = '<div class="empty">Les présences ne sont visibles que connecté à claude.ai, avec un accès à cette page.</div>';
      return;
    }
    utilisateur = user;
    Promise.all([
      user ? user.canEdit().catch(function () { return false; }) : Promise.resolve(false),
      user && typeof user.compte === "function" ? user.compte().catch(function () { return null; }) : Promise.resolve(null),
      claudeApi.use("comptes").catch(function () { return null; })
    ]).then(function (rr) {
      peutModifier = !!rr[0];
      monCompte = rr[1];
      comptesApi = rr[2];
      if (comptesApi) chargerComptes();
      if (monCompte) { moiCourant = monCompte.membre; }
      document.getElementById("role").textContent = peutModifier ? "Administrateur" : monCompte ? (monCompte.nom || "Membre") : "Consultation seule";
      document.body.classList.toggle("vue-membre", !peutModifier);
      charge.r = true;
      afficher();
    });
    db.collection("membres").onSnapshot(function (snap) {
      membres = {};
      snap.docs.forEach(function (d) { var v = d.data(); membres[d.id] = Object.assign({ id: d.id }, v); });
      charge.m = true; afficher();
    }, function () { toast("Les membres n’ont pas pu être chargés. Rechargez la page."); });
    db.collection("evaluations").onSnapshot(function (snap) {
      evaluations = {};
      snap.docs.forEach(function (d) { evaluations[d.id] = d.data(); });
      afficher();
    }, function () { /* pas encore d'évaluation */ });
    db.collection("programmes").onSnapshot(function (snap) {
      programmes = {};
      snap.docs.forEach(function (d) { programmes[d.id] = d.data(); });
      afficher();
    }, function () { /* pas de programme enregistré */ });
    db.collection("dahiras").onSnapshot(function (snap) {
      dahirasCfg = {};
      snap.docs.forEach(function (d) { dahirasCfg[d.id] = d.data(); });
      afficher();
    }, function () { /* sans réglage : Kourel 2 puis Kourel 1 */ });
    db.collection("khassidas").onSnapshot(function (snap) {
      khassidas = {};
      snap.docs.forEach(function (d) { khassidas[d.id] = Object.assign({ id: d.id }, d.data()); });
      afficher();
    }, function () { toast("La liste des khassidas n’a pas pu être chargée."); });
    db.collection("seances").onSnapshot(function (snap) {
      seances = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .sort(function (a, b) { return a.date === b.date ? (a.type < b.type ? -1 : 1) : (a.date < b.date ? 1 : -1); });
      charge.s = true; afficher();
    }, function () { toast("Les séances n’ont pas pu être chargées. Rechargez la page."); });
  });
})();
</script>
